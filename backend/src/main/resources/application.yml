spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: studenttask-backend
  datasource:
    # No defaults: startup fails when these are not provided by the environment.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    mode: ${TELEGRAM_MODE:polling}
    api-base: ${TELEGRAM_API_BASE:https://api.telegram.org}
    public-base-url: ${TELEGRAM_PUBLIC_BASE_URL:}
    runners-enabled: ${TELEGRAM_RUNNERS_ENABLED:true}
  auth:
    # Secure flag of the refresh cookie. Set AUTH_REFRESH_COOKIE_SECURE=false ONLY for local http development.
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  reminder:
    # Set REMINDER_SCHEDULER_ENABLED=false to stop the scheduled reminder tick and the daily cleanup.
    enabled: ${REMINDER_SCHEDULER_ENABLED:true}
    poll-interval: ${REMINDER_POLL_INTERVAL:PT60S}
    catch-up-window: PT10M
    batch-size: 200
    sending-timeout: PT5M
    max-attempts: 4
    retry-backoff: PT1M,PT5M,PT15M
    log-retention-days: 90
    send-pause: PT0.04S
    cleanup-cron: ${REMINDER_CLEANUP_CRON:0 30 3 * * *}
    cleanup-batch-size: 1000
